<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 03 - Registration Form</title>
</head>
<body>
  <!--
    ===== Answers to the questions =====

    1) placeholder vs value:
       - placeholder: a hint shown inside the input; it disappears when the user types
         and it is NOT submitted with the form.
       - value: the real data of the input; it stays in the field and IS submitted with the form.

    2) required:
       Makes the field mandatory; the form cannot be submitted until it is filled.

    3) radio vs checkbox:
       - radio: choose only ONE option from a group (same name).
       - checkbox: choose ONE OR MORE options.
  -->
  <form>

    <!-- 1. Full Name -->
    <p>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </p><hr>

    <!-- 2. Email -->
    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" required>
    </p><hr>

    <!-- 3. Password -->
    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required>
    </p><hr>

    <!-- 4. Phone Number -->
    <p>
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="01012345678">
    </p><hr>

    <!-- 5. Date of Birth -->
    <p>
      <label for="birthdate">Date of Birth:</label>
      <input type="date" id="birthdate" name="birthdate">
    </p><hr>

    <!-- 6. Gender (Radio Buttons) -->
    <p>
      Gender:<br><br>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
    </p><hr>

    <!-- 7. Skills (Checkboxes) -->
    <p>
      Skills:<br><br>
      <input type="checkbox" id="html" name="skills" value="html">
      <label for="html">HTML</label>

      <input type="checkbox" id="css" name="skills" value="css">
      <label for="css">CSS</label>

      <input type="checkbox" id="js" name="skills" value="javascript">
      <label for="js">JavaScript</label>
    </p><hr>

    <!-- 8. Country (Dropdown List) -->
    <p>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="">-- Select Country --</option>
        <option value="egypt">Egypt</option>
        <option value="saudi">Saudi Arabia</option>
        <option value="uae">United Arab Emirates</option>
        <option value="other">Other</option>
      </select>
    </p><hr>

    <!-- 9. Upload Image -->
    <p>
      <label for="image">Upload Image:</label>
      <input type="file" id="image" name="image" accept="image/*">
    </p><hr>

    <!-- 10. Submit Button -->
    <p>
      <button type="submit">Submit</button>
    </p><hr>

  </form>
</body>
</html>
